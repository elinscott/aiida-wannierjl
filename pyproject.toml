[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# See https://www.python.org/dev/peps/pep-0621/
name = "aiida-wannierjl"
dynamic = ["version"]  # read from aiida_wannierjl/src/__init__.py
description = "AiiDA plugin wrapping Wannier.jl to manipulate Wannier functions from within AiiDA workflows"
authors = [{name = "Edward Linscott", email = "edwardlinscott@gmail.com"}]
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Development Status :: 3 - Alpha",
    "Framework :: AiiDA"
]
keywords = ["aiida", "plugin", "wannier90", "wannier-functions"]
requires-python = ">=3.10"
dependencies = [
    "aiida-core>=2.7.1,<3"
]

[project.optional-dependencies]
pre-commit = [
  'pre-commit~=3.5',
]
docs = [
    "sphinx",
    "sphinxcontrib-details-directive",
    "furo",
    "markupsafe<2.1"
]
workflows = [
    "aiida-workgraph>=0.8,<0.9",
    "aiida-quantumespresso>=4.6"
]

[project.urls]
Source = "https://github.com/elinscott/aiida-wannierjl"
Documentation = "https://aiida-wannierjl.readthedocs.io/"
"Issue Tracker" = "https://github.com/elinscott/aiida-wannierjl/issues"

[project.entry-points."aiida.calculations"]
"wannierjl.check_neighbors" = "aiida_wannierjl.calculations.check_neighbors:CheckNeighborsCalculation"
"wannierjl.generate_neighbors" = "aiida_wannierjl.calculations.generate_neighbors:GenerateNeighborsCalculation"
"wannierjl.split" = "aiida_wannierjl.calculations.split:SplitCalculation"

[project.entry-points."aiida.parsers"]
"wannierjl.check_neighbors" = "aiida_wannierjl.parsers.check_neighbors:CheckNeighborsParser"
"wannierjl.generate_neighbors" = "aiida_wannierjl.parsers.generate_neighbors:GenerateNeighborsParser"
"wannierjl.split" = "aiida_wannierjl.parsers.split:SplitParser"

[tool.pytest.ini_options]
# Configuration for [pytest](https://docs.pytest.org)
python_files = "test_*.py example_*.py"
addopts = "--pdbcls=IPython.terminal.debugger:TerminalPdb"
filterwarnings = [
    "ignore::DeprecationWarning:aiida:",
    "ignore:Creating AiiDA configuration folder:",
    "ignore::DeprecationWarning:plumpy:",
    "ignore::DeprecationWarning:yaml:",
]


[tool.coverage.run]
# Configuration of [coverage.py](https://coverage.readthedocs.io)
# reporting which lines of your plugin are covered by tests
source = ["src/aiida_wannierjl"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = [
  'F403',  # Star imports unable to detect undefined names
  'F405',  # Import may be undefined or defined from star imports
  'PLR0911',  # Too many return statements
  'PLR0912',  # Too many branches
  'PLR0913',  # Too many arguments in function definition
  'PLR0915',  # Too many statements
  'PLR2004',  # Magic value used in comparison
  'RUF005',  # Consider iterable unpacking instead of concatenation
  'RUF012'  # Mutable class attributes should be annotated with `typing.ClassVar`
]
select = [
  'E',  # pydocstyle
  'W',  # pydocstyle
  'F',  # pyflakes
  'I',  # isort
  'N',  # pep8-naming
  'PLC',  # pylint-convention
  'PLE',  # pylint-error
  'PLR',  # pylint-refactor
  'PLW',  # pylint-warning
  'RUF'  # ruff
]

## Hatch configurations

[tool.hatch.version]
path = "src/aiida_wannierjl/__init__.py"

[tool.hatch.build.targets.wheel]
# Explicit src-layout package selection so every file under the package —
# including the packaged Julia driver/setup scripts in julia/*.jl — ships in
# the wheel and is resolvable via importlib.resources.
packages = ["src/aiida_wannierjl"]

[tool.hatch.envs.hatch-test]
# Install the ``workflows`` extra (aiida-workgraph + aiida-quantumespresso) so the
# split_wannierization workflow tests execute rather than importorskip in CI.
features = ["workflows"]
dependencies = [
    'pgtest~=1.3,>=1.3.1',
    'coverage~=7.0',
    'pytest~=7.0',
    "pytest-cov~=4.1",
    "ipdb"
]

[tool.hatch.envs.hatch-test.scripts]
# These are the efault scripts provided by hatch.
# The have been copied to make the execution more transparent

# This command is run with the command `hatch test`
run = "pytest{env:HATCH_TEST_ARGS:} {args}"
# The three commands below are run with the command `hatch test --coverage`
run-cov = "coverage run -m pytest{env:HATCH_TEST_ARGS:} {args}"
cov-combine = "coverage combine"
cov-report = "coverage report"

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.10", "3.11", "3.12", "3.13"]

[tool.hatch.envs.hatch-static-analysis]
dependencies = ["ruff==0.4.3"]

[tool.hatch.envs.hatch-static-analysis.scripts]
# Fixes are executed with `hatch fmt`.
# Checks are executed with `hatch fmt --check`.

format-check = "ruff format --check --config pyproject.toml {args:.}"
format-fix = "ruff format --config pyproject.toml {args:.}"
lint-check = "ruff check --config pyproject.toml {args:.}"
lint-fix = "ruff check --config pyproject.toml --fix --exit-non-zero-on-fix --show-fixes {args:.}"

[tool.hatch.envs.docs]
# ``workflows`` is needed so that autodoc can import ``aiida_wannierjl.workflows``
# (which imports ``aiida_workgraph``) when generating the API documentation.
features = ["docs", "workflows"]

[tool.hatch.envs.docs.scripts]
build = [
  "make -C docs"
]
