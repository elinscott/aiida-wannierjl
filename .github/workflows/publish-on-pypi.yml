name: Publish on PyPI

on:
  push:
    tags:
      # After vMajor.Minor.Patch _anything_ is allowed (without "/") !
      - v[0-9]+.[0-9]+.[0-9]+*

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.repository == 'elinscott/aiida-wannierjl' && startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - name: Set up Python 3.12
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.12'

    - name: Install hatch
      run: |
        python -m pip install --upgrade pip
        python -m pip install hatch~=1.12.0

    # Token-based publishing is intentional; migrating to PyPI trusted
    # publishing needs a trusted-publisher configured on the PyPI side first.
    - name: Build and publish  # zizmor: ignore[use-trusted-publishing]
      run: |
        hatch publish
      env:
        HATCH_INDEX_USER: __token__
        HATCH_INDEX_AUTH:  ${{ secrets.pypi_token }}
